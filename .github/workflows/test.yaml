---
name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check versions
        run: |
          go version
          go env

      - name: Test and take a coverage
        env:
          GOTESTSUM_FORMAT: standard-verbose
          GOTESTSUM_JUNITFILE: _output/tests.xml
          GOTESTSUM_JSONFILE: _output/tests.json
        run: |
          mkdir -p _output
          make coverage

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: codecov/codecov-action@v6
        with:
          name: test-results
          path: _output/

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fmt and lint for sources
        run: |-
          make lint
          git add -N . && git diff --exit-code
