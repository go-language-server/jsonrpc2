name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test/${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check versions
        run: |
          go version
          go env

      - name: Test and take a coverage
        env:
          GOTESTSUM_FORMAT: standard-verbose
          GOTESTSUM_JUNITFILE: _output/tests.xml
          GOTESTSUM_JSONFILE: _output/tests.json
        run: |
          mkdir -p _output
          make coverage

      - name: Upload coverage to Codecov
        if: success() && matrix.runner == 'ubuntu-slim'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always() && matrix.runner == 'ubuntu-slim'
        uses: codecov/codecov-action@v6
        with:
          name: test-results
          directory: _output/

  lint:
    name: lint
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run fmt and lint for sources
        run: |-
          make lint
          git add -N . && git diff --exit-code

  benchmark-artifacts:
    name: benchmark/${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Capture benchmark artifacts
        run: |
          set -euo pipefail
          mkdir -p _output/benchmarks
          {
            printf 'created_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'status=%s\n' "$(git status --short --branch)"
            go version
            go env GOOS GOARCH GOFLAGS GOWORK GOPROXY GOMODCACHE GOVERSION
            uname -a
          } > _output/benchmarks/env.txt
          go test -run '^$' \
            -bench 'Benchmark(ConnPipelinedVoidRoundTrip|PipelineClientVoidRoundTrip)$' \
            -benchmem -count=3 . | tee _output/benchmarks/pipeline.txt
          go test -C internal/benchmark -mod=mod -run '^$' \
            -bench 'Benchmark(RoundTripVoid|Decode|Encode)$' \
            -benchtime=10x -benchmem -count=1 . \
            | tee _output/benchmarks/internal-smoke.txt

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-artifacts-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _output/benchmarks/
          if-no-files-found: error
          retention-days: 14
